[project]
name = "bank-history-widget"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
black = "^25.1.0"
isort = "^6.0.0"
mypy = "^1.15.0"
flake8 = "^7.1.1"


[tool.poetry.group.tests.dependencies]
pytest = "^8.3.5"


[tool.poetry.group.dev.dependencies]
pytest-cov = "^6.0.0"
python-dotenv = "^1.0.1"
requests = "^2.32.3"
pandas = "^2.2.3"
openpyxl = "^3.1.5"
pandas-stubs = "^2.2.3.250308"


[tool.black]
line-length = 119
exclude = '''
(
  | \.git
  | htmlcov\
)
'''

# Конструкция для добавления нескольких исключений
#'''
#(
#  | \.git
#)
#'''

[tool.isort]
line_length = 119
multi_line_output = 1

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = [
    'tests',
    'venv',
    'htmlcov'
    ]
